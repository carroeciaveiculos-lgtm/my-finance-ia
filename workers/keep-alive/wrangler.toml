name = "keep-alive-supabase"
main = "src/index.ts"
compatibility_date = "2024-04-01"

[triggers]
crons = ["0 0 */2 * *"] # Executa a cada 48 horas (às 00:00 UTC a cada 2 dias)

[vars]
# Variáveis de ambiente configuradas no Cloudflare Dashboard ou wrangler secret
SUPABASE_URL = "https://your-supabase-url.supabase.co"
SUPABASE_ANON_KEY = "your-supabase-anon-key"
